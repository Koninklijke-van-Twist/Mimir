name: Deploy to FTP on master push

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Debug env
        run: |
          echo "Host: $FTP_HOST"
          echo "User: $FTP_USERNAME"
          # echo "Pass: $FTP_PASSWORD"  # liever niet loggen 😉
          echo "Remote dir: $FTP_REMOTE_DIR"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

      # Mirror web/ only. Deliberately do not chmod after deploy: server
      # permissions are managed on the host, and a trailing SITE CHMOD keeps
      # resetting production modes. --no-perms stops lftp from applying local
      # git modes (755). Excluding the writable dirs (data/**, cache/**,
      # analytics/**) stops the mirror from resetting them, including via
      # .gitkeep. auth.php stays on the server. data/.htaccess is uploaded
      # explicitly after the mirror.
      # NL: bewust geen chmod na deploy. Rechten worden op de host beheerd.
      # --no-perms plus uitsluiten van data/**, cache/** en analytics/**
      # voorkomt dat deploy die rechten terugzet.
      - name: Deploy web/ to FTP (with delete & excludes)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" << EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-allow false
          set ftp:passive-mode yes

          cd "$FTP_REMOTE_DIR"

          mirror -R --delete --no-perms \
            --exclude-glob .htaccess \
            --exclude-glob cache/** \
            --exclude-glob analytics/** \
            --exclude-glob analytics/*.sqlite \
            --exclude-glob analytics/*.sqlite-* \
            --exclude-glob auth.php \
            --exclude-glob data/** \
            --exclude-glob data/*.sqlite \
            --exclude-glob data/*.sqlite-* \
            --exclude-glob data/*.db \
            --exclude-glob data/*.json \
            --exclude-glob data/*.json.tmp.* \
            --exclude-glob data/*.lock \
            --exclude-glob data/*.checkpoint \
            --exclude-glob data/*.checkpoint/** \
            ./web .

          put -O data web/data/.htaccess

          bye
          EOF
