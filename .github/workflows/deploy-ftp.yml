name: Deploy to FTP on master push

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Debug env
        run: |
          echo "Host: $FTP_HOST"
          echo "User: $FTP_USERNAME"
          # echo "Pass: $FTP_PASSWORD"  # liever niet loggen 😉
          echo "Remote dir: $FTP_REMOTE_DIR"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

      # PHP and other code landed as mode 600 because mirror used --no-perms
      # and the FTP server applied its umask; Apache needs >=644 to read them.
      # On the runner, set 755 on directories and 644 on files, then mirror
      # without --no-perms so lftp uploads those modes (Asclepius-style).
      # Exclude writable runtime dirs data and cache (the directory node and
      # its contents) plus sqlite/json/lock globs, and exclude auth.php and
      # .htaccess. Do not exclude analytics/** so analytics.php deploys; only
      # analytics/*.sqlite and analytics/*.sqlite-* stay on the server.
      # No put into data/. The next step's chmod 777 heals the writable
      # runtime dirs and, temporarily, the sqlite files (db, -wal, -shm,
      # -journal) after the mirror. A directory mode of 777 does not make
      # an existing file owned by another user writable.
      # NL: 600 kwam van --no-perms plus de server-umask. Lokale 644/755 en
      # mirror zonder --no-perms maakt PHP leesbaar voor Apache. chmod 777
      # geldt tijdelijk ook voor de sqlite-bestanden, niet alleen de mappen.
      # data en cache (map én inhoud) blijven buiten de mirror.
      - name: Deploy web/ to FTP (with delete & excludes)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          find ./web -type d -exec chmod 755 {} +
          find ./web -type f -exec chmod 644 {} +

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" << EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-allow false
          set ftp:passive-mode yes

          cd "$FTP_REMOTE_DIR"

          mirror -R --delete \
            --exclude-glob .htaccess \
            --exclude-glob auth.php \
            --exclude-glob data \
            --exclude-glob data/ \
            --exclude-glob data/** \
            --exclude-glob data/*.sqlite \
            --exclude-glob data/*.sqlite-* \
            --exclude-glob data/*.db \
            --exclude-glob data/*.json \
            --exclude-glob data/*.json.tmp.* \
            --exclude-glob data/*.lock \
            --exclude-glob data/*.checkpoint \
            --exclude-glob data/*.checkpoint/** \
            --exclude-glob cache \
            --exclude-glob cache/ \
            --exclude-glob cache/** \
            --exclude-glob analytics/*.sqlite \
            --exclude-glob analytics/*.sqlite-* \
            ./web .

          bye
          EOF

      # TODO: tijdelijk 777 op de datamap én op db/-wal/-shm/-journal.
      # Een mapmode 777 maakt een bestaand bestand van een andere user
      # (cron versus php-fpm/www-data) niet schrijfbaar. SITE CHMOD op de
      # bestanden wel, als de FTP-user dat mag. Nooit de data-map of
      # db-bestanden overschrijven of verwijderen; de mirror sluit ze uit.
      # `glob -a` gaat door als een patroon niets treft. fail-exit false en
      # `|| true`: een 550 mag de job niet rood maken.
      # NL: tijdelijk ook de sqlite-bestanden op 777, niet alleen de mappen.
      - name: chmod data, cache, analytics and sqlite files (best-effort)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" << EOF || true
          set cmd:fail-exit false
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-allow false
          set ftp:passive-mode yes

          cd "$FTP_REMOTE_DIR"

          chmod 777 data
          chmod 777 cache
          chmod 777 analytics
          glob -a chmod 777 data/*.sqlite
          glob -a chmod 777 data/*.sqlite-*
          glob -a chmod 777 data/*.db
          glob -a chmod 777 data/*.db-*
          glob -a chmod 777 data/*-journal
          glob -a chmod 777 analytics/*.sqlite
          glob -a chmod 777 analytics/*.sqlite-*
          glob -a chmod 777 analytics/*.db
          glob -a chmod 777 analytics/*.db-*
          glob -a chmod 777 analytics/*-journal

          bye
          EOF

      # Na de upload: health aanroepen. Ging het circuit open tijdens de
      # upload (halve bestanden, migratie), dan sluit de lichte probe het hier
      # meteen in plaats van bij het eerstvolgende UI-verzoek. Best-effort.
      - name: health check (closes a circuit opened during deploy)
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(curl -s -m 30 https://sleutels.kvt.nl/mimir/api/health.php || true)
            echo "$out"
            case "$out" in *'"status":"ok"'*) exit 0;; esac
            sleep 10
          done
          echo "::warning::Mimir health niet ok na deploy"
