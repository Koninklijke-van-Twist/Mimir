name: Deploy to FTP on master push

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Debug env
        run: |
          echo "Host: $FTP_HOST"
          echo "User: $FTP_USERNAME"
          # echo "Pass: $FTP_PASSWORD"  # liever niet loggen 😉
          echo "Remote dir: $FTP_REMOTE_DIR"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

      # Mirror web/ with --no-perms (Argus-pattern). Local git modes (755) must
      # not overwrite the server. Exclude writable runtime dirs data and cache
      # (the directory node and its contents) plus sqlite/json/lock globs, and
      # exclude auth.php and .htaccess. Do not exclude analytics/** so
      # analytics.php deploys again; only analytics/*.sqlite and
      # analytics/*.sqlite-* stay on the server. No put into data/.
      # Host/FTP may reset directory modes during mirror; the next step heals
      # the writable dirs with chmod 777 on the directories only.
      # NL: Argus-patroon — alleen directory-chmod. data en cache (map én
      # inhoud) blijven buiten de mirror; analytics.php gaat wel mee. Geen put
      # naar data/. Host/FTP kan modi tijdens de mirror resetten; de volgende
      # stap herstelt de schrijfbare mappen elke deploy.
      - name: Deploy web/ to FTP (with delete & excludes)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" << EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-allow false
          set ftp:passive-mode yes

          cd "$FTP_REMOTE_DIR"

          mirror -R --delete --no-perms \
            --exclude-glob .htaccess \
            --exclude-glob auth.php \
            --exclude-glob data \
            --exclude-glob data/** \
            --exclude-glob data/*.sqlite \
            --exclude-glob data/*.sqlite-* \
            --exclude-glob data/*.db \
            --exclude-glob data/*.json \
            --exclude-glob data/*.json.tmp.* \
            --exclude-glob data/*.lock \
            --exclude-glob data/*.checkpoint \
            --exclude-glob data/*.checkpoint/** \
            --exclude-glob cache \
            --exclude-glob cache/** \
            --exclude-glob analytics/*.sqlite \
            --exclude-glob analytics/*.sqlite-* \
            ./web .

          bye
          EOF

      # Argus-pattern: directory chmod only, and only after mirror/bye succeeded.
      # chmod 777 on data, cache, and analytics — never on sqlite/wal/shm files.
      # Host/FTP may reset modes during mirror; this heals writable dirs every
      # deploy. `set cmd:fail-exit false` in the same lftp session as the mirror
      # is not enough: lftp still exits 1 and the Actions job (bash -e) goes red
      # after a successful upload. This separate session uses fail-exit false so
      # one 550 does not skip the other chmods, and `|| true` so any chmod
      # failure cannot fail the job.
      # NL: Argus-patroon — alleen chmod 777 op de mappen data, cache en
      # analytics, niet op sqlite-bestanden. Host/FTP kan modi tijdens de
      # mirror resetten; dit herstelt de schrijfbare mappen elke deploy.
      # Best-effort: een 550 mag de job niet rood maken.
      - name: chmod data, cache, analytics (best-effort)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" << EOF || true
          set cmd:fail-exit false
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-allow false
          set ftp:passive-mode yes

          cd "$FTP_REMOTE_DIR"

          chmod 777 data
          chmod 777 cache
          chmod 777 analytics

          bye
          EOF
