name: Deploy to FTP on master push

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Debug env
        run: |
          echo "Host: $FTP_HOST"
          echo "User: $FTP_USERNAME"
          # echo "Pass: $FTP_PASSWORD"  # liever niet loggen 😉
          echo "Remote dir: $FTP_REMOTE_DIR"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

      # Mirror web/ only. Deploy must never alter modes on data/, cache/, or
      # analytics/: those permissions are host-managed only. No SITE CHMOD.
      # --no-perms stops lftp from applying local git modes (755). Exclude the
      # directory node itself (data, cache, analytics) as well as its contents
      # (data/**, cache/**, analytics/**). Contents-only globs still let mirror
      # mkdir or touch the directory, and the FTP user's umask (often 755)
      # then leaves Apache unable to write sqlite and the other runtime files.
      # auth.php and the sqlite globs stay excluded. data/.htaccess remains in
      # git for new installs but is a server-only file: do not upload it.
      # A put into data/ recreates or touches that directory the same way.
      # NL: deploy mag nooit de modus van data/, cache/ of analytics/ wijzigen.
      # Rechten zijn alleen host-beheerd. data/.htaccess blijft op de server;
      # die uploaden we niet.
      - name: Deploy web/ to FTP (with delete & excludes)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" << EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-allow false
          set ftp:passive-mode yes

          cd "$FTP_REMOTE_DIR"

          mirror -R --delete --no-perms \
            --exclude-glob .htaccess \
            --exclude-glob data \
            --exclude-glob data/** \
            --exclude-glob cache \
            --exclude-glob cache/** \
            --exclude-glob analytics \
            --exclude-glob analytics/** \
            --exclude-glob analytics/*.sqlite \
            --exclude-glob analytics/*.sqlite-* \
            --exclude-glob auth.php \
            --exclude-glob data/*.sqlite \
            --exclude-glob data/*.sqlite-* \
            --exclude-glob data/*.db \
            --exclude-glob data/*.json \
            --exclude-glob data/*.json.tmp.* \
            --exclude-glob data/*.lock \
            --exclude-glob data/*.checkpoint \
            --exclude-glob data/*.checkpoint/** \
            ./web .

          bye
          EOF
